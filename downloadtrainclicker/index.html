<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Train Clicker</title>

    <script>
        const iosUrl = "https://apps.apple.com/by/app/trainclicker-idle-evolution/id1549726315";
        const androidUrl = "https://play.google.com/store/apps/details?id=com.Turbulence101Games.trainclickerevolution&hl=en_US";
        const steamUrl = "https://store.steampowered.com/app/622980/TrainClicker_Idle_Evolution/";

        const userAgent = navigator.userAgent || navigator.vendor || "";

        const isAndroid = /android/i.test(userAgent);

        const isIOS =
            /iPad|iPhone|iPod/i.test(userAgent) ||
            (navigator.platform === "MacIntel" &&
             navigator.maxTouchPoints > 1);

        if (isIOS) {
            window.location.replace(iosUrl);
        } else if (isAndroid) {
            window.location.replace(androidUrl);
        } else {
            // Windows, macOS, Linux, and other desktop devices
            window.location.replace(steamUrl);
        }
    </script>
</head>
<body></body>
</html>
